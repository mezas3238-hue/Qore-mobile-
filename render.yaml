# Movete Fácil — Render STAGING only. This draft never deploys by itself.
# Owner must approve creation, confirm any charges and set secrets in Render.
# This references the GitHub integration branch only AFTER an Owner-approved merge.
# Free instance is for noncommercial smoke; NOT certified for >1M users.
# This Blueprint does NOT provision PostgreSQL: Supabase STAGING is required.
previews:
  generation: off
services:
  - type: web
    name: movete-facil-staging-api
    runtime: node
    plan: free
    rootDir: apps/mobility-expo
    branch: integration/qore-mobile-e2e-four-apps-20261027
    buildCommand: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
    startCommand: node server/run-g4-render-staging.mjs
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: QORE_MOBILITY_ENV
        value: staging
      - key: LIVE_TRIPS_ENABLED
        value: "false"
      - key: QORE_RENDER_NO_COMMERCIAL_TRIPS
        value: "true"
      # Safe per-replica budgets, NOT fleet throughput or autoscaling.
      # CPU/DB capacity and horizontal scale must be benchmarked separately.
      - key: QORE_EDGE_MAX_READS
        value: "256"
      - key: QORE_EDGE_MAX_WRITES
        value: "128"
      - key: QORE_EDGE_MAX_IDENTITIES
        value: "32768"
      - key: QORE_RENDER_STAGING_APPROVED
        sync: false
      - key: QORE_RENDER_HOSTNAME
        sync: false
      - key: QORE_STAGING_PROJECT_REF
        sync: false
      - key: QORE_STAGING_PUBLISHABLE_KEY
        sync: false
      - key: QORE_STAGING_SERVICE_ROLE_KEY
        sync: false
      - key: QORE_HISTORY_CURSOR_SIGNING_KEY
        sync: false
      # Private operator-only read-only Auth/DB probe; never the service role key.
      - key: QORE_STAGING_READINESS_KEY
        sync: false
      - key: QORE_ADMIN_BROWSER_ORIGIN
        sync: false
