openapi: 3.1.0
info:
  title: QORE Mobile Read API
  version: 0.1.0
  description: >
    Read-only supervision contract between QORE Mobile Gateway and the
    official Android/iOS application. Trading command endpoints are
    intentionally absent.
servers:
  - url: https://gateway.invalid
    description: Placeholder only; no production endpoint is committed.
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Gateway health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/portfolio:
    get:
      operationId: getPortfolio
      responses:
        "200":
          description: Canonical portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSnapshot"
  /v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Authorized accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSnapshot"
  /v1/traders:
    get:
      operationId: listTraders
      responses:
        "200":
          description: Authorized traders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraderSnapshot"
  /v1/positions:
    get:
      operationId: listPositions
      responses:
        "200":
          description: Current positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionSnapshot"
components:
  schemas:
    Health:
      type: object
      required: [service, status, mode, server_time]
      properties:
        service: { type: string }
        status: { type: string }
        mode:
          type: string
          const: read-only
        server_time:
          type: string
          format: date-time
    Freshness:
      type: string
      enum: [live, delayed, stale, offline, unknown]
    TradingMode:
      type: string
      enum: [demo, shadow, live]
    PortfolioSnapshot:
      type: object
      required:
        [as_of, account_count, trader_count, active_positions, freshness]
      properties:
        as_of: { type: string, format: date-time }
        account_count: { type: integer, minimum: 0 }
        trader_count: { type: integer, minimum: 0 }
        active_positions: { type: integer, minimum: 0 }
        balance: { type: number }
        equity: { type: number }
        realized_pnl_today: { type: number }
        floating_pnl: { type: number }
        daily_drawdown_fraction: { type: number, minimum: 0 }
        total_drawdown_fraction: { type: number, minimum: 0 }
        freshness: { $ref: "#/components/schemas/Freshness" }
    AccountSnapshot:
      type: object
      required:
        [account_id, provider, label, mode, runtime_id, freshness, as_of]
      properties:
        account_id: { type: string }
        provider: { type: string }
        label: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        runtime_id: { type: string }
        balance: { type: number }
        equity: { type: number }
        realized_pnl_today: { type: number }
        floating_pnl: { type: number }
        daily_drawdown_fraction: { type: number, minimum: 0 }
        total_drawdown_fraction: { type: number, minimum: 0 }
        open_positions: { type: integer, minimum: 0 }
        last_heartbeat: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/Freshness" }
    TraderSnapshot:
      type: object
      required:
        [trader_id, account_id, name, market, mode, state, freshness, as_of]
      properties:
        trader_id: { type: string }
        account_id: { type: string }
        name: { type: string }
        market: { type: string }
        mode: { $ref: "#/components/schemas/TradingMode" }
        state: { type: string }
        last_market_read: { type: string, format: date-time }
        last_signal_or_abstention: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/Freshness" }
        as_of: { type: string, format: date-time }
    PositionSnapshot:
      type: object
      required:
        [position_id, account_id, trader_id, symbol, side, opened_at, as_of]
      properties:
        position_id: { type: string }
        account_id: { type: string }
        trader_id: { type: string }
        symbol: { type: string }
        side:
          type: string
          enum: [long, short]
        entry: { type: number }
        current_price: { type: number }
        stop: { type: number }
        target: { type: number }
        size: { type: number }
        unrealized_pnl: { type: number }
        r_state: { type: number }
        opened_at: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
