[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qore-mobile-gateway"
version = "0.1.0"
description = "Read-only mobile gateway for QORE Core telemetry."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "cryptography>=44,<46",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qore_mobile_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
