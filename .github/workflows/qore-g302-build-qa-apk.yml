name: G307 Android QA APK integration — internal only
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qore-g302-build-qa-apk.yml'
  push:
    branches:
      - integration/qore-g307-android-qa-camera-distribution-20261102
    paths:
      - .github/workflows/qore-g302-build-qa-apk.yml
permissions:
  contents: read
concurrency:
  group: g302-qa-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-internal-qa-apk:
    name: Android QA APK — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        app: [movete-cliente, movete-driver]
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      QORE_QA_BUILD: "true"
      EXPO_PUBLIC_QORE_LIVE_OPERATIONS: "false"
      EXPO_PUBLIC_QORE_G299_OFFLINE_OCR_QA_APPROVED: ${{ matrix.app == 'movete-driver' && 'true' || 'false' }}
      EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED: "false"
      EXPO_PUBLIC_QORE_STAGING_RUNTIME_APPROVED: "false"
      EXPO_PUBLIC_QORE_G290_CAMERA_LAB_APPROVED: "false"
      EXPO_PUBLIC_QORE_G291_OCR_LAB_APPROVED: "false"
      EXPO_PUBLIC_QORE_STAGING_API_ORIGIN: ""
      EXPO_PUBLIC_QORE_STAGING_API_HOST: ""
      EXPO_PUBLIC_SUPABASE_URL: ""
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Fetch QA source — never production
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK on GitHub Ubuntu runner
        shell: bash
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/platforms/android-* | tail -5
          ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | tail -5
      - name: Install Expo dependencies — no secrets
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact isolated QA Android application ID
        shell: bash
        run: |
          npx expo config --json > "$RUNNER_TEMP/g302-config.json"
          expected="com.movetefacil.${{ matrix.app == 'movete-driver' && 'driver' || 'cliente' }}.qa"
          node - "$RUNNER_TEMP/g302-config.json" "$expected" <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(config.android?.package!==process.argv[3]||
             config.extra?.qaBuild!==true||
             config.extra?.liveOperationsEnabled!==false){
            process.stderr.write('QA application identity or LIVE OFF contract invalid\n');
            process.exit(1);
          }
          process.stdout.write('Verified isolated QA package '+config.android.package+'\n');
          NODE
      - name: Verify Driver offline camera gate and no networking credentials
        if: matrix.app == 'movete-driver'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {canRunOfflineDriverOcrQa} from './src/domain/driver-offline-ocr-qa.mjs';
          if (!canRunOfflineDriverOcrQa(process.env)) throw Error('G307: Driver camera QA gate must be OFFLINE and LIVE OFF');
          if (process.env.EXPO_PUBLIC_SUPABASE_URL || process.env.EXPO_PUBLIC_QORE_STAGING_API_ORIGIN) throw Error('G307: network origins forbidden');
          console.log('G307: Driver offline OCR/camera QA verified, no secrets');
          NODE
      - name: Run Android Driver domain regression tests
        if: matrix.app == 'movete-driver'
        run: npm run test
      - name: Generate Android native project from Expo config
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble installable standalone Android APK — QA only
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK file and SHA256
        shell: bash
        run: |
          file="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$file"
          sha256sum "$file"
          ls -lh "$file"
      - name: Upload tester APK as private-to-repo Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: g302-${{ matrix.app }}-qa-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
