name: QORE G309 Cliente GPS geocoder Android QA APK
on:
  pull_request:
    paths:
      - 'apps/movete-cliente/**'
      - '.github/workflows/qore-g309-client-gps-android-qa-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qore-g309-client-gps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-client-gps-qa:
    name: Cliente GPS native QA APK (NO LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED: 'false'
      EXPO_PUBLIC_F1_OWNER_APPROVED: 'false'
      EXPO_PUBLIC_MOTO_OWNER_APPROVED: 'false'
      EXPO_PUBLIC_F1_STAGING_ORIGIN: ''
      EXPO_PUBLIC_F1_STAGING_PINNED_ORIGIN: ''
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assert all commercial and connected runtime flags OFF
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED" = false
          test "$EXPO_PUBLIC_F1_OWNER_APPROVED" = false
          test "$EXPO_PUBLIC_MOTO_OWNER_APPROVED" = false
          test -z "$EXPO_PUBLIC_F1_STAGING_ORIGIN"
          test -z "$EXPO_PUBLIC_SUPABASE_URL"
          test -d "$ANDROID_HOME"
      - name: Install Cliente and run location tests
        working-directory: apps/movete-cliente
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run test
      - name: Set isolated QA package and app name
        working-directory: apps/movete-cliente
        run: |
          node -e 'const fs=require("fs");const p="app.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.expo.name="Movete Cliente GPS QA";j.expo.android.package="com.movetefacil.cliente.gpsqa";fs.writeFileSync(p,JSON.stringify(j,null,2));'
      - name: Expo prebuild Android native location and geocoder
        working-directory: apps/movete-cliente
        run: npx expo prebuild --platform android --no-install --clean
      - name: Generate standalone local QA APK
        working-directory: apps/movete-cliente/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify artifact and no production enablement
        shell: bash
        run: |
          test -s apps/movete-cliente/android/app/build/outputs/apk/release/app-release.apk
          test "$EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED" = false
      - uses: actions/upload-artifact@v4
        with:
          name: QORE-G309-Cliente-GPS-Android-QA
          path: apps/movete-cliente/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5
          if-no-files-found: error
          compression-level: 0
