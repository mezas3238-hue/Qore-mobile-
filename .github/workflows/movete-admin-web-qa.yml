# QA-only build check for the Architect B Admin web application.
# File and CI ownership: Architect A (.github/**).
# Does not deploy, connect to remote services, or use credentials.
name: Movete Facil Admin web QA

on:
  pull_request:
    branches:
      - feature/mobility-monorepo-isolated-20261016
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'apps/movete-admin/**'
      - '.github/workflows/movete-admin-web-qa.yml'

permissions:
  contents: read

jobs:
  admin-web-qa:
    name: Admin isolated tests, TypeScript and build (QA only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/movete-admin
    steps:
      # Check out B's exact HEAD, not a synthetic merge with diverged A.
      - name: Check out PR head without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require independently installable Admin web package
        shell: bash
        run: |
          test -f package.json
          node -e "const p=require('./package.json'); for(const s of ['check','build']) if(!p.scripts?.[s]) process.exit(1); if(p.name!=='movete-facil-admin-web') process.exit(1)"

      - name: Install only Admin web dependencies (no lifecycle scripts)
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run Admin unit tests and TypeScript checks
        run: npm run check

      - name: Build Admin web QA bundle (no deployment)
        run: npm run build

      - name: Verify that QA bundle was emitted
        shell: bash
        run: |
          test -f dist/index.html
          echo "Admin web QA passed. This is NOT a production deployment or real MFA/Auth certification."
