name: QORE G304 Commerce prepaid-only and reconciliation QA
on:
  pull_request:
    paths:
      - 'apps/mobility-expo/server/g304-*'
      - 'apps/movete-cliente/src/domain/g304-payment-choice-policy*'
      - 'apps/mobility-expo/server/g7-supabase-finance-repository*'
      - 'apps/mobility-expo/docs/g304-*'
      - '.github/workflows/qore-g304-commerce-prepayment-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce-prepay-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_PAYMENTS_ENABLED: 'false'
      PSP_PAYOUTS_ENABLED: 'false'
      COMMERCE_COD_ENABLED: 'false'
      LIVE_TRIPS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/mobility-expo/server/g304-merchant-financial-reconciliation-qa.mjs
          node --check apps/mobility-expo/server/g304-merchant-financial-reconciliation-qa.test.mjs
      - name: Prepayment before goods and post-delivery reconciliation
        run: node --test apps/mobility-expo/server/g304-merchant-financial-reconciliation-qa.test.mjs
      - name: Client options: merchants prepaid, passengers cash or card
        run: node --test apps/movete-cliente/src/domain/g304-payment-choice-policy.test.mjs
      - name: Legacy finance adapter refuses merchant CASH
        run: node --test apps/mobility-expo/server/g7-supabase-finance-repository.test.mjs
      - name: Existing G302/G303 digital and trip cash settlement regressions
        run: node --test apps/mobility-expo/server/g302-auto-settlement-qa.test.mjs apps/mobility-expo/server/g303-cash-commission-qa.test.mjs
      - name: Verify all production and merchant-cash flags OFF
        run: |
          node --input-type=module -e 'import * as x from "./apps/mobility-expo/server/g304-merchant-financial-reconciliation-qa.mjs"; if(x.G304_COMMERCE_PAYMENTS_LIVE!==false||x.G304_COMMERCE_PAYOUTS_LIVE!==false||x.G304_COD_LIVE!==false||x.G304_CASH_CHECKOUT_ENABLED!==false)process.exit(1);'
          echo 'G304: PREPAID digital commerce QA only; no actual payment or payouts.'
