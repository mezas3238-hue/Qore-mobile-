      - 'apps/mobility-expo/docs/backend/staging_only/G10_*'
      - 'apps/mobility-expo/server/g12-delivery-push-concurrency-ci.py'
permissions:
  contents: read
jobs:
  sql-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qore_ci
          POSTGRES_PASSWORD: qore_ci_only
          POSTGRES_DB: qore_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qore_ci -d qore_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: qore_ci
      PGPASSWORD: qore_ci_only
      PGDATABASE: qore_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::integer >= 160000 AS postgres_16_or_later"
          psql -v ON_ERROR_STOP=1 -c 'SELECT pg_advisory_lock(924001)'
          psql -v ON_ERROR_STOP=1 -c 'SELECT pg_advisory_unlock(924001)'
      - name: Explicitly keep G4 integration blocked until prerequisite schema and fixtures are wired
        run: |
          echo "PostgreSQL 16 service is available; this smoke test does NOT claim G4 transaction coverage."

      - name: G12 disposable delivery push SQL contract
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_DELIVERY_PUSH_DISPOSABLE_SMOKE_POSTGRES_CI_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_DELIVERY_PUSH_CLAIM_ACK_POSTGRES_CI_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_DELIVERY_PUSH_DISPOSABLE_ASSERT_POSTGRES_CI_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_DELIVERY_PUSH_EXPIRE_ASSERT_POSTGRES_CI_ONLY.sql

      - name: G12 two independent PostgreSQL sessions compete for same offer
        run: |
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.mobility_stage_delivery_offer_outbox SET claimed_at=NULL,claimed_by=NULL,accepted_for_processing_at=NULL,provider_ticket_id=NULL WHERE offer_id='00000000-0000-4000-8000-000000000012'"
          python3 -m pip install 'psycopg[binary]>=3.2,<4'
          python3 apps/mobility-expo/server/g12-delivery-push-concurrency-ci.py

  real-schema-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qore_ci
          POSTGRES_PASSWORD: qore_ci_only
          POSTGRES_DB: qore_disposable_chain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qore_ci -d qore_disposable_chain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: qore_ci
      PGPASSWORD: qore_ci_only
      PGDATABASE: qore_disposable_chain
      PGAPPNAME: qore_ci_disposable_chain
    steps:
      - uses: actions/checkout@v4
      - name: Guard isolated local chain database
        run: |
          test "$PGHOST" = "localhost"
          test "$PGDATABASE" = "qore_disposable_chain"
          test "$PGAPPNAME" = "qore_ci_disposable_chain"
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(),current_setting('application_name')"
      - name: Install synthetic Auth scaffold (CI only)
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G0_DISPOSABLE_AUTH_SCAFFOLD_POSTGRES_CI_ONLY.sql
      - name: Apply real isolated G1 G2 G3 G4 G5 G10 G12 SQL
        run: |
          set -euo pipefail
          base=apps/mobility-expo/docs/backend/staging_only
          for migration in \
            G1_ISOLATED_SUPABASE_BASELINE_DO_NOT_APPLY_PRODUCTION.sql \
            G2_AUTO_MOTO_COMPLIANCE_DO_NOT_APPLY_PRODUCTION.sql \
            G2_SERVER_PREFLIGHT_DO_NOT_APPLY_PRODUCTION.sql \
            G3_AUTO_DEMO_TRIP_CONTRACT_POSTGRES_CI_ONLY.sql \
            G4_PRIVATE_AUTO_OFFERS_POSTGRES_CI_ONLY.sql \
            G5_DELIVERY_CUSTODY_POSTGRES_CI_ONLY.sql \
            G6_MERCHANT_ORDERS_POSTGRES_CI_ONLY.sql \
            G10_PRIVATE_DELIVERY_OFFERS_POSTGRES_CI_ONLY.sql \
            G12_DELIVERY_PUSH_CLAIM_ACK_POSTGRES_CI_ONLY.sql; do
            psql -v ON_ERROR_STOP=1 -f "$base/$migration"
          done
      - name: Validate real schema, RLS and service-role RPC invocations
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_FULL_CHAIN_SCHEMA_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Exercise synthetic G5-G10-G12 delivery on real migration chain
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G12_REAL_CHAIN_DELIVERY_E2E_POSTGRES_CI_ONLY.sql
      - name: Upgrade real G12 rows to safely fenced G13 SQL
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G13_DELIVERY_PUSH_FENCED_DISPOSABLE_CI_ONLY.sql
      - name: Test G13 lease fencing, legacy revocation, ACK and ambiguous outcomes
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G13_FENCED_DELIVERY_PUSH_FULL_CHAIN_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Verify G13 with two independent PostgreSQL sessions
        run: |
          python3 -m pip install 'psycopg[binary]>=3.2,<4'
          python3 apps/mobility-expo/server/g13-fenced-delivery-push-concurrency-ci.py
      - name: Test two courier acceptances racing for one delivery
        run: python3 apps/mobility-expo/server/g14-competing-courier-acceptance-ci.py
      - name: Apply G15 private courier polling fallback
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G15_COURIER_PRIVATE_OFFER_POLL_POSTGRES_CI_ONLY.sql
      - name: Verify G15 polling without push, privacy and expiry
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G15_COURIER_PRIVATE_POLL_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Apply G16 private AUTO driver offer polling
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G16_DRIVER_PRIVATE_AUTO_POLL_POSTGRES_CI_ONLY.sql
      - name: Validate real G16 private AUTO discovery and one-winner acceptance
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G16_DRIVER_PRIVATE_AUTO_POLL_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Apply G17 private Driver documentation and review registry
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G17_PRIVATE_DRIVER_DOCUMENTS_POSTGRES_CI_ONLY.sql
      - name: Test G17 role isolation, KYC evidence and immutable admin review
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G17_PRIVATE_DRIVER_DOCUMENTS_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Apply G18 exclusive Driver onboarding role transition
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G18_DRIVER_ROLE_ENROLLMENT_POSTGRES_CI_ONLY.sql
      - name: Verify G18 no mixed passenger/Driver identity or fake driver eligibility
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G18_DRIVER_ROLE_ENROLLMENT_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Apply G20 latest reviewed KYC license gate to AUTO and courier preflights
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G20_DRIVER_KYC_PREFLIGHT_FENCING_POSTGRES_CI_ONLY.sql
      - name: Verify G20 rejections at offer acceptance, expired license and MOTO passengers
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G20_DRIVER_KYC_PREFLIGHT_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G26 unbounded owner-history covering indexes (disposable only)
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G26_HISTORY_INDEXES_POSTGRES_CI_ONLY.sql
      - name: G26 real PostgreSQL history 1200 rows, 24 pages and authenticated RLS
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G26_HISTORY_UNBOUNDED_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G26.3 scale history beyond 30,000 real PostgreSQL rows with full keyset traversal
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G26_HISTORY_LARGE_VOLUME_POSTGRES_CI_ONLY.sql
      - name: G26.4 install disposable immutable owner-and-created-at history guards
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G26_HISTORY_IMMUTABLE_ORIGIN_POSTGRES_CI_ONLY.sql
      - name: G26.4 attack 15 altered/backdated histories and retain lawful lifecycle updates
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G26_HISTORY_IMMUTABLE_ORIGIN_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G26.5 verify two-session PostgreSQL MVCC late commits and recovery by refresh
        run: python3 apps/mobility-expo/server/g26-history-mvcc-concurrency-ci.py

      - name: G27 A04.2 add independent Admin and Owner backoffice registry in disposable DB
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G27_BACKOFFICE_ROLES_POSTGRES_CI_ONLY.sql
      - name: G27 A04.2 reject native dual role, revoked privileges, cross-role scopes and client writes
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G27_BACKOFFICE_ROLES_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G28 install already authored G7 and G8 real schemas on disposable chain only
        run: |
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G7_FARES_SIMULATED_PAYMENTS_POSTGRES_CI_ONLY.sql
          psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G8_SAFETY_OPERATIONS_POSTGRES_CI_ONLY.sql
      - name: G28 install scoped read-only incident queue SQL (disposable only)
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G28_ADMIN_INCIDENT_PAGE_POSTGRES_CI_ONLY.sql
      - name: G28 test 121 incident rows in three full keyset pages and reject Owner/dual-role/access
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G28_ADMIN_INCIDENT_PAGE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G29 add G2 authoritative vehicle-review revision on disposable chain
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G2_REVIEW_AUDIT_DO_NOT_APPLY_PRODUCTION.sql
      - name: G29 install server-only real AUTO KYC source query
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G29_ADMIN_KYC_PAGE_POSTGRES_CI_ONLY.sql
      - name: G29 verify 121 KYC rows, documentary truth, MOTO exclusion and role isolation
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G29_ADMIN_KYC_PAGE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G30 install privileged read projection of actual Admin source-audit events
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G30_ADMIN_AUDIT_PAGE_POSTGRES_CI_ONLY.sql
      - name: G30 traverse 123 actual stored event rows in three pages and deny forged actor
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G30_ADMIN_AUDIT_PAGE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G31 apply safe service-specific zone coverage and observed telemetry in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G31_ADMIN_ZONE_COVERAGE_POSTGRES_CI_ONLY.sql
      - name: G31 prove 121 zone-service rows, stale/unknown telemetry, no live eligibility and Admin-only scope
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G31_ADMIN_ZONE_COVERAGE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G31.2 real PostgreSQL stress — 30030 zone-service rows and 601 keyset pages, unlimited total
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G31_ADMIN_ZONES_30030_ROWS_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G32 install private Driver signal quarantine and atomic sequence fencing
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G32_DRIVER_LOCATION_SIGNAL_QUARANTINE_POSTGRES_CI_ONLY.sql
      - name: G32 assert real DB revocation, replay denial and no location-to-availability promotion
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G32_DRIVER_SIGNAL_QUARANTINE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G32.2 two PostgreSQL sessions race same Driver sequence and concurrent consent revocation
        run: python3 apps/mobility-expo/server/g32-driver-telemetry-concurrency-ci.py
      - name: G33 install private read-only QA diagnostics of quarantined Driver signals
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G33_QUARANTINED_ZONE_DIAGNOSTICS_POSTGRES_CI_ONLY.sql
      - name: G33 validate busy trip, busy delivery, consent withdrawal, cross-zone latest and no G31 publication
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G33_QUARANTINED_ZONE_DIAGNOSTICS_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G34 consent revision trigger and append-only audit, strengthen G32 SQL revision check
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G34_CONSENT_REVISION_AUDIT_FENCING_POSTGRES_CI_ONLY.sql
      - name: G34 reject stale Driver consent revision after withdrawal and re-opt-in in disposable DB
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G34_CONSENT_REVISION_AUDIT_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G35 install private per-service documentary readiness QA probe
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G35_DRIVER_DOCUMENTARY_READINESS_POSTGRES_CI_ONLY.sql
      - name: G35 prove source-backed KYC, cargo insurance expiry, busy-driver exclusion and no G31 promotion
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G35_DRIVER_DOCUMENTARY_READINESS_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G36 install unique active Driver slot shared by AUTO rides and deliveries
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G36_CROSS_SERVICE_DRIVER_SLOT_POSTGRES_CI_ONLY.sql
      - name: G36 reject direct-write and cross-service double-booking, validate terminal release and replay
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G36_CROSS_SERVICE_DRIVER_SLOT_ASSERT_POSTGRES_CI_ONLY.sql

      - name: G37 install PostgreSQL-only state machine and strip direct assignment/event DML
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G37_TRIP_DELIVERY_DML_STATE_FENCE_POSTGRES_CI_ONLY.sql
      - name: G37 adversarial service_role direct writes, legal RPC and immutable lifecycle
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G37_TRIP_DELIVERY_DML_STATE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G37 reverify G36 two PostgreSQL sessions and both private-offer race orders after DML revoke
        run: python3 apps/mobility-expo/server/g36-cross-service-driver-race-ci.py

      - name: G38.0 separate delivered/disputed case from occupied Driver slot
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G38_0_DISPUTE_CASE_NO_SLOT_POSTGRES_CI_ONLY.sql
      - name: G38.0 real private cargo lifecycle delivery-dispute-return and idempotency
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G38_0_DISPUTE_CASE_ASSERT_POSTGRES_CI_ONLY.sql
      - name: G38.1 install fail-closed transactional offer proof and eligibility fence
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G38_1_TRUSTED_OFFER_ACCEPTANCE_FENCE_POSTGRES_CI_ONLY.sql
      - name: G38.1 deny untrusted AUTO and DELIVERY private accept without certification
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G38_1_TRUSTED_OFFER_ACCEPTANCE_ASSERT_POSTGRES_CI_ONLY.sql

      - name: G38.2 forged proof and fresh synthetic GPS must never unlock legal zone dispatch
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G38_2_FORGED_PROOF_SIGNAL_ASSERT_POSTGRES_CI_ONLY.sql

