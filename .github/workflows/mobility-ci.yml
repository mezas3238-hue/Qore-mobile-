name: QORE Mobility Expo isolated CI
on:
  push:
    branches: [main, 'feature/mobility-*']
    paths:
      - 'apps/mobility-expo/**'
      - '.github/workflows/mobility-ci.yml'
  pull_request:
    paths:
      - 'apps/mobility-expo/**'
      - '.github/workflows/mobility-ci.yml'
permissions:
  contents: read
jobs:
  mobility-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobility-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and pure unit tests
        run: npm run check
      - name: Verify staging gateway Auth and no-LIVE isolation
        run: node --test server/*.test.mjs
      - name: Staging Auth signup gate contract (offline mocks, no credentials)
        run: node --test scripts/staging-auth-policy-gate.test.mjs
      - name: Storage REST E2E smoke offline safety contracts (no credentials or uploads)
        run: node --test scripts/staging-storage-readonly.test.mjs
      - name: Three synthetic Auth actors and cross-account isolation contract (offline)
        run: node --test scripts/staging-three-actors-readonly.test.mjs
      - name: Check staging smoke and local server syntax (without credentials)
        run: node --check scripts/staging-auth-readonly.mjs && node --check scripts/staging-three-actors-readonly.mjs && node --check scripts/staging-auth-policy-gate.mjs && node --check scripts/staging-storage-readonly.mjs && node --check server/run-g2-local-staging-gateway.mjs && node --check server/run-g4-local-staging-radar.mjs
      - name: Verify live operations remain disabled
        run: node scripts/check-safety.mjs
      - name: Expo web export (not Android/iOS E2E)
        run: npx expo export --platform web
        env:
          CI: '1'

  g2-postgres-contract:
    name: G1-G10 PostgreSQL ephemeral contracts, private delivery dispatch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: qore_mobility_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qore_mobility_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
      - name: Test G2 DDL, grants, RLS and server preflight in disposable Postgres
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g2_postgres_smoke.sql
      - name: Race two concurrent G3 fictional AUTO acceptances (no remote database)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          bash apps/mobility-expo/scripts/sql/g3_concurrent_accept_ci.sh

      - name: Run G4 private driver offer TTL, audit and deny-by-default SQL (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g4_offers_smoke.sql
      - name: Race competing verified G4 driver offers (two separate Postgres clients)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          bash apps/mobility-expo/scripts/sql/g4_concurrent_offer_accept_ci.sh

      - name: G4 outbox claim/ACK controls on disposable PostgreSQL (never push)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g4_push_outbox_smoke.sql
      - name: Race two independent PostgreSQL push workers for one private offer
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          bash apps/mobility-expo/scripts/sql/g4_push_claim_concurrency_ci.sh
      - name: G5 AUTO/MOTO delivery custody, proof and participant RLS (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g5_delivery_smoke.sql
      - name: G6 merchant catalog, inventory, preparation and G5 linkage (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g6_merchant_orders_smoke.sql
      - name: G7 versioned fares and simulated balanced payment ledger (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g7_fares_payments_smoke.sql
      - name: G8 incidents, SOS, suspensions and append-only operations audit (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g8_safety_operations_smoke.sql
      - name: G9 merchant onboarding, approval, branch and catalog management (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g9_merchant_management_smoke.sql
      - name: G10 private delivery offers and exclusive courier assignment (ephemeral)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          psql -h localhost -p 5432 -U postgres -d qore_mobility_ci -v ON_ERROR_STOP=1 -f apps/mobility-expo/scripts/sql/g10_delivery_dispatch_smoke.sql
      - name: Race two private G10 courier offers (separate PostgreSQL clients)
        env:
          PGPASSWORD: ci_fixture_only
        run: |
          bash apps/mobility-expo/scripts/sql/g10_concurrent_delivery_accept_ci.sh
