name: QORE G282 Railway private G113 retry activation contracts
on:
  pull_request:
    paths:
      - 'apps/mobility-expo/server/g282-railway-private-auto-retry-gate*.mjs'
      - 'apps/mobility-expo/server/run-g4-railway-staging.mjs'
      - '.github/workflows/qore-g282-railway-private-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate feature gate, no-job RPC preflight and worker stop
        run: |
          node --check apps/mobility-expo/server/g282-railway-private-auto-retry-gate.mjs
          node --check apps/mobility-expo/server/run-g4-railway-staging.mjs
          node --test apps/mobility-expo/server/g282-railway-private-auto-retry-gate.test.mjs
      - name: No Railway deploy, private tokens or real dispatch
        run: echo 'G282 tests are offline-only; scheduler OFF by default; no LIVE/PSP'
