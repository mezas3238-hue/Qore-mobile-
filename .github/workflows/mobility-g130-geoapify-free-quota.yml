# Architect A G130: fully offline, non-billable, disposable PostgreSQL16.
# No Geoapify API key is passed to these jobs. No Render or Supabase writes.
name: QORE G130 Geoapify Free durable quota QA
on:
  push:
    branches:
      - feature/mobility-monorepo-isolated-20261016
    paths:
      - '.github/workflows/mobility-g130-geoapify-free-quota.yml'
      - 'apps/mobility-expo/server/g130-*'
      - 'apps/mobility-expo/docs/backend/staging_only/G130_*'
  pull_request:
    paths:
      - '.github/workflows/mobility-g130-geoapify-free-quota.yml'
      - 'apps/mobility-expo/server/g130-*'
      - 'apps/mobility-expo/docs/backend/staging_only/G130_*'
permissions:
  contents: read
jobs:
  geoapify-quota-disposable:
    name: G130 PostgreSQL atomic quota + Node road adapter (NO external APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qore_ci
          POSTGRES_PASSWORD: qore_ci_only
          POSTGRES_DB: qore_disposable_geoapify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qore_ci -d qore_disposable_geoapify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: qore_ci
      PGPASSWORD: qore_ci_only
      PGDATABASE: qore_disposable_geoapify
      PGAPPNAME: qore_ci_disposable_geoapify
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse external and non-disposable database
        shell: bash
        run: |
          set -euo pipefail
          test "${PGHOST}" = localhost
          test "${PGDATABASE}" = qore_disposable_geoapify
          test "${PGAPPNAME}" = qore_ci_disposable_geoapify
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(),current_setting('application_name')"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: G130 isolated Geoapify quota SQL migration
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G130_GEOAPIFY_FREE_DURABLE_QUOTA_POSTGRES_CI_ONLY.sql
      - name: G130 SQL role, idempotency, 100-call and 300-credit negative tests
        run: psql -v ON_ERROR_STOP=1 -f apps/mobility-expo/docs/backend/staging_only/G130_GEOAPIFY_FREE_DURABLE_QUOTA_ASSERT_POSTGRES_CI_ONLY.sql
      - name: Clear only the disposable test counters for independent concurrency proof
        run: |
          psql -v ON_ERROR_STOP=1 -c 'TRUNCATE public.mobility_stage_g130_free_route_reservations, public.mobility_stage_g130_free_quota_days'
      - name: G130 competing server replicas on PostgreSQL16, zero provider HTTP
        run: |
          python3 -m pip install 'psycopg[binary]>=3.2,<4'
          python3 apps/mobility-expo/server/g130-geoapify-quota-concurrency-ci.py
      - name: G130 adapter plus existing G128 road-source regression suite
        run: |
          node --test apps/mobility-expo/server/g130-geoapify-free-quota-adapter.test.mjs
          node --test apps/mobility-expo/server/g128-geoapify-cargo-road-resolver.test.mjs
      - name: Explicit provider deployment boundary
        run: |
          echo 'PASS only means atomic disposable DB quota and mocked routing.'
          echo 'It does NOT enable Geoapify requests, real geocoding, LIVE tariffs or billing.'
