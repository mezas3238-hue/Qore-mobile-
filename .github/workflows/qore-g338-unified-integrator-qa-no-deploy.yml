name: QORE G338 unified integrator MOTO delivery GPS PG17 (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/qore-g338-unified-integrator-qa-no-deploy.yml'
      - 'infra/qore-staging/migrations/g336_*'
      - 'infra/qore-staging/ci/g336_*'
      - 'infra/qore-staging/migrations/g337_*'
      - 'infra/qore-staging/ci/g337_*'
      - 'apps/mobility-expo/server/g336-*'
      - 'apps/mobility-expo/server/g4-staging-runtime.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrator-delivery-and-contract:
    name: G336 delivery G10 + G328 independent pin + G332 SQL safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_TRIPS_ENABLED: 'false'
      LIVE_PAYMENTS_ENABLED: 'false'
      PSP_PAYOUTS_ENABLED: 'false'
      COMMERCE_COD_ENABLED: 'false'
      QORE_G328_PIN_BOUND_ROUTING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert all operational flags OFF
        run: |
          test "$LIVE_TRIPS_ENABLED" = false
          test "$LIVE_PAYMENTS_ENABLED" = false
          test "$PSP_PAYOUTS_ENABLED" = false
          test "$COMMERCE_COD_ENABLED" = false
          test "$QORE_G328_PIN_BOUND_ROUTING_ENABLED" = false
      - name: Verify no historical PG16 CI_ONLY SQL has been promoted
        run: |
          node --test apps/mobility-expo/scripts/g332-persistent-e2e-source-gate.test.mjs
          node apps/mobility-expo/scripts/g332-persistent-e2e-source-gate.mjs
      - name: Verify delivery G10, GPS-to-quote and legacy G73 isolation
        run: |
          node --test \
            apps/mobility-expo/server/g336-delivery-offer-only-http.test.mjs \
            apps/mobility-expo/server/g10-delivery-offer-gateway.test.mjs \
            apps/mobility-expo/server/g328-pinned-route-g73.test.mjs \
            apps/mobility-expo/server/g73-f1-auto-gateway.test.mjs

  integrator-moto-postgres17:
    name: G337 MOTO quote book cancel and ledger (disposable PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: g338_moto_disposable_only
          POSTGRES_DB: qore_disposable_g337
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qore_disposable_g337"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: g338_moto_disposable_only
      PGDATABASE: qore_disposable_g337
      PGAPPNAME: qore_disposable_chain
      LIVE_TRIPS_ENABLED: 'false'
      LIVE_PAYMENTS_ENABLED: 'false'
      PSP_PAYOUTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove PG17 disposable-only target and safe flags
        run: |
          test "$PGDATABASE" = qore_disposable_g337
          test "$PGAPPNAME" = qore_disposable_chain
          test "$LIVE_TRIPS_ENABLED" = false
          test "$LIVE_PAYMENTS_ENABLED" = false
          test "$PSP_PAYOUTS_ENABLED" = false
          psql -X -Atqc "select current_database() || ':' || (current_setting('server_version_num')::int >= 170000)" | grep -Fx 'qore_disposable_g337:true'
      - name: G337 native MOTO full quote-to-cancellation SQL chain
        run: psql -X -v ON_ERROR_STOP=1 --single-transaction -f infra/qore-staging/ci/g337_moto_pg17_disposable_only.sql
      - name: Block promotion of G100 original PG16 fixture tables
        run: |
          psql -X -Atqc "select case when to_regclass('public.mobility_stage_g100_moto_quotes') is null and to_regclass('public.mobility_stage_g100_moto_trips') is null and to_regclass('public.mobility_stage_g100_moto_entries') is null then 'OK' else 'FAIL' end" | grep -Fx OK

  integrator-gps-postgres17:
    name: G329 + G336 manual GPS retention and rollback (disposable PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: g338_gps_disposable_only
          POSTGRES_DB: qore_g329_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qore_g329_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: g338_gps_disposable_only
      PGDATABASE: qore_g329_ci
      LIVE_TRIPS_ENABLED: 'false'
      LIVE_PAYMENTS_ENABLED: 'false'
      PSP_PAYOUTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove disposable PG17 and operations OFF
        run: |
          test "$PGDATABASE" = qore_g329_ci
          test "$LIVE_TRIPS_ENABLED" = false
          test "$LIVE_PAYMENTS_ENABLED" = false
          test "$PSP_PAYOUTS_ENABLED" = false
          psql -X -Atqc "select current_database() || ':' || (current_setting('server_version_num')::int >= 170000)" | grep -Fx 'qore_g329_ci:true'
      - name: G329 pin evidence and G336 manual retention security/replay
        run: psql -X -v ON_ERROR_STOP=1 -f infra/qore-staging/ci/g336_manual_g329_pin_retention_pg17_disposable_only.sql
      - name: Refuse audited rollback and verify empty-audit rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback=infra/qore-staging/migrations/g336_g329_manual_pin_retention_rollback_EMPTY_ONLY_NOT_DEPLOYED.sql
          if psql -X -v ON_ERROR_STOP=1 -f "$rollback"; then
            echo 'G338 unsafe GPS audit rollback succeeded' >&2
            exit 1
          fi
          test "$(psql -X -Atqc 'select count(*) from qore_stage_internal.mobility_stage_g336_pin_retention_runs')" = 1
          psql -X -v ON_ERROR_STOP=1 -c 'delete from qore_stage_internal.mobility_stage_g336_pin_retention_runs'
          psql -X -v ON_ERROR_STOP=1 -f "$rollback"
          psql -X -Atqc "select to_regprocedure('qore_stage_internal.mobility_stage_g336_manual_expired_pin_retention(timestamptz,integer,boolean,text)') is null" | grep -Fx t
          test "$(psql -X -Atqc 'select count(*) from qore_stage_internal.mobility_stage_g329_auto_pinned_routes')" = 1
          test "$(psql -X -Atqc 'select count(*) from public.mobility_stage_g73_auto_routes')" = 3
