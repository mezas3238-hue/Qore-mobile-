name: QORE G314 Android QA public direct APK download (NO LIVE)
on:
  push:
    branches: ['qa/qore-g314-direct-apk-download-20261112']
    paths: ['.github/workflows/qore-g314-direct-android-qa-apks.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qore-g314-qa-assets
  cancel-in-progress: false
env:
  CI: '1'
  EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED: 'false'
  EXPO_PUBLIC_QORE_STAGING_RUNTIME_APPROVED: 'false'
  EXPO_PUBLIC_F1_OWNER_APPROVED: 'false'
  EXPO_PUBLIC_MOTO_OWNER_APPROVED: 'false'
  EXPO_PUBLIC_SUPABASE_URL: ''
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
  EXPO_PUBLIC_QORE_STAGING_API_ORIGIN: ''
  EXPO_PUBLIC_QORE_STAGING_API_HOST: ''
  EXPO_PUBLIC_F1_STAGING_ORIGIN: ''
  EXPO_PUBLIC_F1_STAGING_PINNED_ORIGIN: ''
jobs:
  cliente-qa:
    name: Compile Cliente G312 Android ARM64 QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_QORE_G299_OFFLINE_OCR_QA_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Enforce QA-only no-backend configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED" = false
          test "$EXPO_PUBLIC_QORE_STAGING_RUNTIME_APPROVED" = false
          test -z "$EXPO_PUBLIC_SUPABASE_URL"
          test -z "$EXPO_PUBLIC_F1_STAGING_ORIGIN"
      - name: Install and test Cliente
        working-directory: apps/movete-cliente
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run test
      - name: Use isolated Cliente QA app id
        working-directory: apps/movete-cliente
        run: |
          node -e 'const fs=require("fs");const p="app.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));x.expo.name="Movete Cliente G314 QA";x.expo.android.package="com.movetefacil.cliente.g314qa";fs.writeFileSync(p,JSON.stringify(x,null,2))'
      - name: Generate native Android
        working-directory: apps/movete-cliente
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compile ARM64 QA APK
        working-directory: apps/movete-cliente/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: Verify APK and rename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp apps/movete-cliente/android/app/build/outputs/apk/release/app-release.apk out/Movete-Facil-Cliente-G314-QA-arm64.apk
          test -s out/Movete-Facil-Cliente-G314-QA-arm64.apk
          unzip -Z1 out/Movete-Facil-Cliente-G314-QA-arm64.apk | grep -q '^lib/arm64-v8a/'
          sha256sum out/Movete-Facil-Cliente-G314-QA-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cliente-g314-qa
          path: out/Movete-Facil-Cliente-G314-QA-arm64.apk
          if-no-files-found: error
          retention-days: 7
  driver-qa:
    name: Compile Driver G310/G313 Android ARM64 QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_QORE_G299_OFFLINE_OCR_QA_APPROVED: 'true'
      EXPO_PUBLIC_QORE_G290_CAMERA_LAB_APPROVED: 'false'
      EXPO_PUBLIC_QORE_G291_OCR_LAB_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Enforce Driver offline QA-only
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPO_PUBLIC_LIVE_OPERATIONS_ENABLED" = false
          test "$EXPO_PUBLIC_QORE_G299_OFFLINE_OCR_QA_APPROVED" = true
          test "$EXPO_PUBLIC_QORE_STAGING_RUNTIME_APPROVED" = false
          test -z "$EXPO_PUBLIC_SUPABASE_URL"
          test -z "$EXPO_PUBLIC_QORE_STAGING_API_ORIGIN"
      - name: Install and test Driver
        working-directory: apps/movete-driver
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run test
      - name: Use isolated Driver QA app id
        working-directory: apps/movete-driver
        run: |
          node -e 'const fs=require("fs");const p="app.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));x.expo.name="Movete Driver G314 QA";x.expo.android.package="com.movetefacil.driver.g314qa";fs.writeFileSync(p,JSON.stringify(x,null,2))'
      - name: Generate native Android ML Kit
        working-directory: apps/movete-driver
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compile ARM64 QA APK
        working-directory: apps/movete-driver/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: Verify APK and rename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp apps/movete-driver/android/app/build/outputs/apk/release/app-release.apk out/Movete-Facil-Driver-G314-QA-arm64.apk
          test -s out/Movete-Facil-Driver-G314-QA-arm64.apk
          unzip -Z1 out/Movete-Facil-Driver-G314-QA-arm64.apk | grep -q '^lib/arm64-v8a/'
          sha256sum out/Movete-Facil-Driver-G314-QA-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: driver-g314-qa
          path: out/Movete-Facil-Driver-G314-QA-arm64.apk
          if-no-files-found: error
          retention-days: 7
  publish-public-qa-pre-release:
    name: Publish QA APK direct HTTPS links (no production)
    runs-on: ubuntu-latest
    needs: [cliente-qa, driver-qa]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cliente-g314-qa
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: driver-g314-qa
          path: out
      - name: Check files and release public QA only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh out/*.apk
          sha256sum out/*.apk
          tag=qore-mobile-G314-android-qa-20261112
          printf '%s\n' 'QA SOLO PARA PRUEBAS: contiene las correcciones Cliente G312 y Driver G310. Android ARM64. NO ES APP COMERCIAL, NO KYC, NO VIAJES, NO COBROS, SIN CREDENCIALES LIVE. No instalar para producción.' > QA-NOTES.txt
          gh release create "$tag" out/Movete-Facil-Cliente-G314-QA-arm64.apk out/Movete-Facil-Driver-G314-QA-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Movete Facil G314 Android QA — descargas directas' \
            --notes-file QA-NOTES.txt --prerelease
