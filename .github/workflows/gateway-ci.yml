name: Gateway CI

on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"

concurrency:
  group: qore-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest -q
