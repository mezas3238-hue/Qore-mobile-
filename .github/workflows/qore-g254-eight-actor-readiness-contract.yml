name: QORE G254 eight independent STAGING QA actors contract
on:
  push:
    paths:
      - 'apps/mobility-expo/scripts/g254-eight-actor-qa-readonly-audit*.mjs'
      - '.github/workflows/qore-g254-eight-actor-readiness-contract.yml'
  pull_request:
    paths:
      - 'apps/mobility-expo/scripts/g254-eight-actor-qa-readonly-audit*.mjs'
      - '.github/workflows/qore-g254-eight-actor-readiness-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-offline-auth-readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent simulated QA-role and failure-mode contracts
        run: node --test apps/mobility-expo/scripts/g254-eight-actor-qa-readonly-audit.test.mjs
      - name: Syntax check audit entrypoint
        run: node --check apps/mobility-expo/scripts/g254-eight-actor-qa-readonly-audit.mjs
# Important: No Supabase keys, passwords or environment mutation in CI.
# Real read-only --audit can only be run on an operator-controlled backend
# with STAGING backend secret and verified disable_signup=true.
